<!doctype html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sun Son Solar registration form">
  <title>Sun Son Solar | Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="brand">SUN SON <span>SOLAR</span></p>
      <p class="step">REGISTRATION</p>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Create an account</p>
      <h1 id="page-title">Start your solar journey.</h1>
      <p>Fields marked with <strong>*</strong> are required.</p>
    </section>

    <form class="registration-form" action="#" method="post">
      <fieldset>
        <legend>Account type</legend>
        <div class="account-types">
          <label class="choice">
            <input type="radio" name="accountType" value="customer" required>
            Customer
          </label>
          <label class="choice">
            <input type="radio" name="accountType" value="employee" required>
            Employee
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Personal information</legend>
        <div class="form-grid">
          <div class="field">
            <label for="firstName">First name <strong>*</strong></label>
            <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="lastName">Last name <strong>*</strong></label>
            <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
          </div>
          <div class="field">
            <label for="middleName">Middle name</label>
            <input id="middleName" name="middleName" type="text" autocomplete="additional-name">
          </div>
          <div class="field">
            <label for="birthdate">Birthdate <strong>*</strong></label>
            <input id="birthdate" name="birthdate" type="date" required>
          </div>
          <div class="field">
            <label for="gender">Gender <strong>*</strong></label>
            <select id="gender" name="gender" required>
              <option value="">Select one</option>
              <option>Female</option>
              <option>Male</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contact information</legend>
        <div class="form-grid">
          <div class="field">
            <label for="email">Email address <strong>*</strong></label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone number <strong>*</strong></label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="field full-width">
            <label for="address">Address <strong>*</strong></label>
            <textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Account security</legend>
        <div class="form-grid">
          <div class="field">
            <label for="username">Username <strong>*</strong></label>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password <strong>*</strong></label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="field full-width">
            <label for="department">Department <span>(employees only)</span></label>
            <input id="department" name="department" type="text">
          </div>
        </div>
      </fieldset>

      <p class="privacy-note">Your information will be used to create and manage your Sun Son Solar account.</p>
      <button class="submit-button" type="submit">
        Create account
      </button>
    </form>
  </main>
</body>
</html>
